<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="Pb0sazMsgnJtyEbYYCu2UqI9A-g2SPqjlOZy0_M1P4Q" />

    <title>Victor Singha</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
            background: white;
            color: #111827;
            transition: background 0.4s, color 0.4s;
        }
        body.red-mode {
            background: #3a0000;
            color: #ffffff;
        }

        #bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: -1;
        }
        #bg canvas {
            display: block;
        }
        .glass-table {
            width: 100%;
            max-width: 320px;
            border-radius: 12px;
            border: 1px solid rgba(0,0,0,0.06);
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.04);
            overflow: hidden;
        }
        body.red-mode .glass-table {
            border-color: rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        table td {
            padding: 10px 16px;
            font-size: 0.825rem;
            font-weight: 500;
            color: #111827;
            border-bottom: 1px solid rgba(0,0,0,0.06);
            transition: all 0.2s;
            text-align: left;
        }
        table tr:last-child td {
            border-bottom: none;
        }
        .desc {
            margin-left: 8px;
            font-size: 0.75rem;
            font-weight: 400;
            color: #9ca3af;
        }
        tr:hover td {
            background: rgba(0,0,0,0.02);
            color: #006039;
        }
        body.red-mode tr:hover td {
            background: rgba(255,255,255,0.04);
            color: #e57373 !important;
        }
        body.red-mode table td {
            color: #ffffff !important;
            border-bottom-color: rgba(255,255,255,0.08);
        }
        body.red-mode .desc {
            color: rgba(255,255,255,0.5) !important;
        }
        body.red-mode .social-link {
            color: rgba(255,255,255,0.5) !important;
        }
        body.red-mode .toggle-btn {
            background: rgba(255,255,255,0.1) !important;
            border-color: rgba(255,255,255,0.2) !important;
            color: rgba(255,255,255,0.7) !important;
        }
        body.red-mode .toggle-btn:hover {
            background: rgba(255,255,255,0.18) !important;
            color: #ffffff !important;
        }
                
    </style>
</head>

<body class="bg-white text-gray-900">

    <!-- Three.js Terrain Background -->
    <div id="bg"></div>

    <div class="max-w-2xl mx-auto px-4 sm:px-8 relative z-10 h-screen flex flex-col overflow-hidden">

        <button id="modeToggle" onclick="toggleRedMode()"
            class="toggle-btn fixed top-4 right-4 sm:top-6 sm:right-6 z-20 p-2.5 rounded-full bg-white/40 backdrop-blur-sm text-gray-500 hover:text-gray-900 transition-all duration-300 shadow-sm hover:shadow-md">
            <i id="modeIcon" data-feather="moon" class="w-5 h-5"></i>
        </button>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col justify-center items-center text-center min-h-0">


            <div class="glass-table">
                <table>
                    <tr onclick="window.open('https://victorsingha.vercel.app/chat', '_blank')" style="cursor:pointer"><td>Chat ✨<span class="desc">Victor AI Portfolio Assistant</span></td></tr>
                    <tr onclick="window.open('https://victorsingha.github.io/sql/', '_blank')" style="cursor:pointer"><td>SQL Server Tool<span class="desc">SQL development scripts</span></td></tr>
                    <tr onclick="window.open('https://victorsingha.github.io/lottie/', '_blank')" style="cursor:pointer"><td>Lottie Json<span class="desc">Animation viewer</span></td></tr>
                    <tr onclick="window.open('https://imbroke1.vercel.app/', '_blank')" style="cursor:pointer"><td>I m Broke<span class="desc">Expense tracker app</span></td></tr>
                    <tr onclick="window.open('https://intelligence-markets.vercel.app/', '_blank')" style="cursor:pointer"><td>Intel Markets<span class="desc">Prediction markets</span></td></tr>
                </table>
            </div>
        </main>

        <!-- Footer -->
        <footer class="pb-8 sm:pb-10">

            <div class="pb-12 text-center">
                <p class="text-xs text-muted tracking-wide text-gray-500 mb-2">Victor Singha © 2026</p>
                <div  class="text-xs text-muted font-sans tracking-wide mb-3 flex flex-row justify-center gap-4">
                    <a href="https://github.com/victorsingha" target="_blank" title="GitHub"
                        class="social-link inline-flex items-center gap-1.5 text-gray-500">
                        <i data-feather="github" class="w-4 h-4"></i>
                    </a>
                    <a href="https://in.linkedin.com/in/victor-singha-48b479148" target="_blank" title="LinkedIn"
                        class="social-link inline-flex items-center gap-1.5 text-gray-500">
                        <i data-feather="linkedin" class="w-4 h-4"></i>
                    </a>
                </div>

            </div>
        </footer>

    </div>

    <script>
        feather.replace({ width: 16, height: 16 });

        // Three.js Terrain
        let terrainMesh, scene, camera, renderer;
        const origPositions = {};

        function initTerrain() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 5, 9);
            camera.lookAt(0, -0.5, 0);

            renderer = new THREE.WebGLRenderer({ alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('bg').appendChild(renderer.domElement);

            const seg = 160;
            const geo = new THREE.PlaneGeometry(36, 36, seg, seg);
            geo.rotateX(-Math.PI / 2);

            const pos = geo.attributes.position.array;
            origPositions.array = new Float32Array(pos);

            const cols = seg + 1;
            const rows = seg + 1;
            const lineVerts = [];
            const idxMap = [];

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols - 1; c++) {
                    const i1 = r * cols + c;
                    const i2 = r * cols + c + 1;
                    idxMap.push(i1, i2);
                    lineVerts.push(pos[i1 * 3], pos[i1 * 3 + 1], pos[i1 * 3 + 2]);
                    lineVerts.push(pos[i2 * 3], pos[i2 * 3 + 1], pos[i2 * 3 + 2]);
                }
            }

            for (let c = 0; c < cols; c++) {
                for (let r = 0; r < rows - 1; r++) {
                    const i1 = r * cols + c;
                    const i2 = (r + 1) * cols + c;
                    idxMap.push(i1, i2);
                    lineVerts.push(pos[i1 * 3], pos[i1 * 3 + 1], pos[i1 * 3 + 2]);
                    lineVerts.push(pos[i2 * 3], pos[i2 * 3 + 1], pos[i2 * 3 + 2]);
                }
            }

            const lineGeo = new THREE.BufferGeometry();
            lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(lineVerts, 3));

            const material = new THREE.LineBasicMaterial({
                color: 0x006039,
                transparent: true,
                opacity: 0.12
            });

            terrainMesh = new THREE.LineSegments(lineGeo, material);
            terrainMesh.userData = { geo, idxMap, cols, rows };
            scene.add(terrainMesh);

            window.addEventListener('resize', () => {
                const w = window.innerWidth;
                const h = window.innerHeight;
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
                renderer.setSize(w, h);
            });
        }

        function updateTerrain(time) {
            const { geo, idxMap } = terrainMesh.userData;
            const origPos = geo.attributes.position.array;
            const linePos = terrainMesh.geometry.attributes.position.array;
            const orig = origPositions.array;

            for (let i = 0; i < origPos.length; i += 3) {
                const x = orig[i];
                const z = orig[i + 2];
                origPos[i + 1] = Math.sin(x * 0.8 + time * 0.4) * 0.4
                               + Math.sin(z * 0.6 + time * 0.3) * 0.3
                               + Math.sin((x + z) * 0.5 + time * 0.6) * 0.2;
            }
            geo.attributes.position.needsUpdate = true;

            for (let i = 0; i < linePos.length; i += 3) {
                const origIdx = idxMap[i / 3];
                linePos[i] = origPos[origIdx * 3];
                linePos[i + 1] = origPos[origIdx * 3 + 1];
                linePos[i + 2] = origPos[origIdx * 3 + 2];
            }
            terrainMesh.geometry.attributes.position.needsUpdate = true;
        }

        function terrainLoop() {
            requestAnimationFrame(terrainLoop);
            updateTerrain(Date.now() * 0.001);
            renderer.render(scene, camera);
        }

        initTerrain();
        terrainLoop();

        function toggleRedMode() {
            document.body.classList.toggle('red-mode');
            const isRed = document.body.classList.contains('red-mode');
            terrainMesh.material.color.set(isRed ? 0xcc4444 : 0x006039);
            const icon = document.getElementById('modeIcon');
            icon.setAttribute('data-feather', isRed ? 'sun' : 'moon');
            feather.replace();
        }
    </script>

</body>

</html>
