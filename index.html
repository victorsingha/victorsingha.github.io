<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            background: #ffffff;
        }
        #bg {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
        }
        #top-bar {
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 3px;
            z-index: 10;
            background: #e5e7eb;
        }
        #top-bar-fill {
            height: 100%;
            width: 0%;
            background: #dc2626;
            animation: fillBar 2.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.4s forwards;
        }
        @keyframes fillBar {
            to { width: 100%; }
        }

        .fade-out #bg {
            animation: bgFade 0.7s ease forwards;
        }
        @keyframes bgFade {
            to { opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="top-bar"><div id="top-bar-fill"></div></div>
    <div id="bg"></div>

    <script>
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 8);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.getElementById('bg').appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
        keyLight.position.set(5, 8, 6);
        keyLight.castShadow = false;
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
        fillLight.position.set(-3, 2, -4);
        scene.add(fillLight);

        const rimLight = new THREE.DirectionalLight(0xffffff, 0.5);
        rimLight.position.set(0, -4, 5);
        scene.add(rimLight);

        const group = new THREE.Group();
        scene.add(group);

        const torusKnot = new THREE.Mesh(
            new THREE.TorusKnotGeometry(1.4, 0.45, 128, 24),
            new THREE.MeshStandardMaterial({ color: 0x4338ca, metalness: 0.35, roughness: 0.3 })
        );
        torusKnot.castShadow = true;
        group.add(torusKnot);

        const innerRing = new THREE.Mesh(
            new THREE.TorusGeometry(1.8, 0.06, 32, 64),
            new THREE.MeshStandardMaterial({ color: 0x7c3aed, metalness: 0.2, roughness: 0.5 })
        );
        innerRing.rotation.x = Math.PI / 3;
        group.add(innerRing);

        const outerRing = new THREE.Mesh(
            new THREE.TorusGeometry(2.3, 0.04, 24, 64),
            new THREE.MeshStandardMaterial({ color: 0xa21caf, metalness: 0.1, roughness: 0.6 })
        );
        outerRing.rotation.x = -Math.PI / 4;
        outerRing.rotation.z = Math.PI / 6;
        group.add(outerRing);

        const satCount = 6;
        const sats = [];
        for (let i = 0; i < satCount; i++) {
            const size = 0.12 + Math.random() * 0.08;
            const geo = new THREE.IcosahedronGeometry(size);
            const colors = [0x4338ca, 0x7c3aed, 0xa21caf, 0xbe185d, 0x1d4ed8, 0x6d28d9];
            const mat = new THREE.MeshStandardMaterial({
                color: colors[i],
                metalness: 0.3,
                roughness: 0.4
            });
            const mesh = new THREE.Mesh(geo, mat);
            const angle = (i / satCount) * Math.PI * 2;
            const radius = 2.8;
            mesh.position.set(Math.cos(angle) * radius, (Math.random() - 0.5) * 0.8, Math.sin(angle) * radius);
            mesh.userData = { angle, radius, speed: 0.25 + Math.random() * 0.15, phase: Math.random() * Math.PI * 2 };
            group.add(mesh);
            sats.push(mesh);
        }

        const pCount = 800;
        const pPos = new Float32Array(pCount * 3);
        const pSizes = new Float32Array(pCount);
        const pData = [];
        const pColors = new Float32Array(pCount * 3);
        const pal = [0x4338ca, 0x7c3aed, 0xa21caf, 0xbe185d];

        for (let i = 0; i < pCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = 1.6 + Math.random() * 4;
            pPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
            pPos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta) * 0.5;
            pPos[i * 3 + 2] = r * Math.cos(phi);
            pSizes[i] = 0.008 + Math.random() * 0.025;
            pData.push({ theta, phi, r, speed: 0.05 + Math.random() * 0.08, phase: Math.random() * Math.PI * 2 });
            const c = new THREE.Color(pal[Math.floor(Math.random() * pal.length)]);
            pColors[i * 3] = c.r;
            pColors[i * 3 + 1] = c.g;
            pColors[i * 3 + 2] = c.b;
        }

        const pGeo = new THREE.BufferGeometry();
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        pGeo.setAttribute('color', new THREE.BufferAttribute(pColors, 3));
        pGeo.setAttribute('size', new THREE.BufferAttribute(pSizes, 1));

        const pMat = new THREE.PointsMaterial({
            size: 0.03,
            vertexColors: true,
            transparent: true,
            opacity: 0.5,
            blending: THREE.NormalBlending,
            depthWrite: false,
            sizeAttenuation: true
        });
        const particles = new THREE.Points(pGeo, pMat);
        group.add(particles);

        let start = Date.now();
        const initPpos = new Float32Array(pPos);

        function animate() {
            requestAnimationFrame(animate);

            const elapsed = (Date.now() - start) * 0.001;

            group.rotation.y = elapsed * 0.15;
            group.rotation.x = Math.sin(elapsed * 0.08) * 0.06;
            group.rotation.z = Math.sin(elapsed * 0.05) * 0.03;

            torusKnot.rotation.x = elapsed * 0.1;
            torusKnot.rotation.y = elapsed * 0.2;

            innerRing.rotation.z = elapsed * 0.08;
            outerRing.rotation.z = elapsed * 0.12;

            for (const s of sats) {
                const a = s.userData.angle + elapsed * s.userData.speed;
                s.position.x = Math.cos(a) * s.userData.radius;
                s.position.z = Math.sin(a) * s.userData.radius;
                s.position.y = Math.sin(elapsed * 0.6 + s.userData.phase) * 0.3;
                s.rotation.x = elapsed * 0.5;
                s.rotation.y = elapsed * 0.7;
            }

            const ppos = particles.geometry.attributes.position.array;
            for (let i = 0; i < pCount; i++) {
                const d = pData[i];
                const a = d.theta + elapsed * d.speed;
                const p = d.phi + Math.sin(elapsed * 0.3 + d.phase) * 0.02;
                const r = d.r + Math.sin(elapsed * 0.2 + d.phase) * 0.1;
                ppos[i * 3] = r * Math.sin(p) * Math.cos(a);
                ppos[i * 3 + 1] = r * Math.sin(p) * Math.sin(a) * 0.5;
                ppos[i * 3 + 2] = r * Math.cos(p);
            }
            particles.geometry.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });

        setTimeout(() => {
            document.body.classList.add('fade-out');
            setTimeout(() => {
                window.location.href = 'https://victorsingha.vercel.app/chat';
            }, 800);
        }, 3600);
    </script>
</body>
</html>
