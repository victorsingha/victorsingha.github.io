<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="Pb0sazMsgnJtyEbYYCu2UqI9A-g2SPqjlOZy0_M1P4Q" />

    <title>Victor Singha</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@800;900&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Bricolage Grotesque', 'Inter', sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
            background: white;
            color: #111827;
            transition: background 0.4s, color 0.4s;
        }
        body.red-mode {
            background: #3a0000;
            color: #ffffff;
        }

        #bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: -1;
        }
        #bg canvas {
            display: block;
        }
        body.red-mode .link-item span {
            color: #ffffff !important;
        }
        body.red-mode .link-item:hover span {
            color: #e57373 !important;
        }
        body.red-mode .link-item p {
            color: rgba(255,255,255,0.5) !important;
        }
        body.red-mode .social-link {
            color: rgba(255,255,255,0.5) !important;
        }
        body.red-mode .divider {
            background: linear-gradient(to right, rgba(255,255,255,0.15), rgba(255,255,255,0.05), transparent) !important;
        }
        body.red-mode .copyright-sep {
            color: rgba(255,255,255,0.2) !important;
        }
        body.red-mode .text-muted {
            color: rgba(255,255,255,0.4) !important;
        }
        body.red-mode .toggle-btn {
            background: rgba(255,255,255,0.1) !important;
            border-color: rgba(255,255,255,0.2) !important;
            color: rgba(255,255,255,0.7) !important;
        }
        body.red-mode .toggle-btn:hover {
            background: rgba(255,255,255,0.18) !important;
            color: #ffffff !important;
        }
        body.red-mode #rotating-word {
            color: #ffffff !important;
        }
        #rotating-word::after {
            content: '|';
            animation: blink 0.7s steps(1) infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>

<body class="bg-white text-gray-900">

    <!-- Three.js Terrain Background -->
    <div id="bg"></div>

    <div class="max-w-2xl mx-auto px-4 sm:px-8 pt-20 sm:pt-32 pb-20 relative z-10 min-h-screen flex flex-col justify-between">

        <button id="modeToggle" onclick="toggleRedMode()"
            class="toggle-btn fixed top-4 right-4 sm:top-6 sm:right-6 z-20 p-2.5 rounded-full bg-white/40 backdrop-blur-sm text-gray-500 hover:text-gray-900 transition-all duration-300 shadow-sm hover:shadow-md">
            <i id="modeIcon" data-feather="moon" class="w-5 h-5"></i>
        </button>

        <!-- Main Content (Left Aligned) -->
        <main class="flex-grow flex flex-col justify-center">

            <header class="mb-12 sm:mb-16">
                <h1 style="font-family: 'Bricolage Grotesque', 'Outfit', sans-serif;"
                    class="text-5xl sm:text-7xl font-black tracking-tight select-none">
                    keep your<br>
                    <span><span id="rotating-word" class="text-[#006039]">design</span> simple</span>
                </h1>
              </header>

            <nav class="max-w-md w-full space-y-6">
                <a href="https://victorsingha.github.io/sql/" target="_blank"
                    class="link-item block group">
                    <span class="text-xl tracking-tight font-semibold text-gray-900 group-hover:text-[#006039] transition-colors duration-200">
                        SQL Tool <i data-feather="arrow-up-right" class="inline w-4 h-4"></i>
                    </span>
                    <p class="text-sm text-gray-400 mt-0.5 leading-relaxed">SQL development scripts</p>
                </a>
                <a href="https://victorsingha.github.io/lottie/" target="_blank"
                    class="link-item block group">
                    <span class="text-xl tracking-tight font-semibold text-gray-900 group-hover:text-[#006039] transition-colors duration-200">
                        Lottie <i data-feather="arrow-up-right" class="inline w-4 h-4"></i>
                    </span>
                    <p class="text-sm text-gray-400 mt-0.5 leading-relaxed">Animation viewer</p>
                </a>
            </nav>
        </main>

        <!-- Footer -->
        <footer class="mt-20 sm:mt-32">

            <div class="pb-12 text-center">
                <p class="text-xs text-muted tracking-wide text-gray-500 mb-2">Victor Singha © 2026</p>
                <div  class="text-xs text-muted font-sans tracking-wide mb-3 flex flex-row justify-center gap-4">
                    <a href="https://github.com/victorsingha" target="_blank" title="GitHub"
                        class="social-link inline-flex items-center gap-1.5 text-gray-500">
                        <i data-feather="github" class="w-4 h-4"></i>
                    </a>
                    <a href="https://in.linkedin.com/in/victor-singha-48b479148" target="_blank" title="LinkedIn"
                        class="social-link inline-flex items-center gap-1.5 text-gray-500">
                        <i data-feather="linkedin" class="w-4 h-4"></i>
                    </a>
                </div>

            </div>
        </footer>

    </div>

    <script>
        feather.replace({ width: 16, height: 16 });

        const words = ['design', 'typo', 'color', 'code', 'system'];
        let idx = 0;
        const el = document.getElementById('rotating-word');

        function typeWord(word, cb) {
            let i = 0;
            function type() {
                if (i < word.length) {
                    el.textContent = word.slice(0, ++i);
                    setTimeout(type, 100);
                } else if (cb) cb();
            }
            type();
        }

        function deleteWord(cb) {
            let cur = el.textContent;
            function del() {
                if (cur.length > 0) {
                    cur = cur.slice(0, -1);
                    el.textContent = cur;
                    setTimeout(del, 60);
                } else if (cb) cb();
            }
            del();
        }

        function cycle() {
            deleteWord(() => {
                idx = (idx + 1) % words.length;
                typeWord(words[idx], () => setTimeout(cycle, 2000));
            });
        }

        setTimeout(cycle, 2000);

        // Three.js Terrain
        let terrainMesh, scene, camera, renderer;
        const origPositions = {};

        function initTerrain() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 5, 9);
            camera.lookAt(0, -0.5, 0);

            renderer = new THREE.WebGLRenderer({ alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('bg').appendChild(renderer.domElement);

            const seg = 160;
            const geo = new THREE.PlaneGeometry(36, 36, seg, seg);
            geo.rotateX(-Math.PI / 2);

            const pos = geo.attributes.position.array;
            origPositions.array = new Float32Array(pos);

            const cols = seg + 1;
            const rows = seg + 1;
            const lineVerts = [];
            const idxMap = [];

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols - 1; c++) {
                    const i1 = r * cols + c;
                    const i2 = r * cols + c + 1;
                    idxMap.push(i1, i2);
                    lineVerts.push(pos[i1 * 3], pos[i1 * 3 + 1], pos[i1 * 3 + 2]);
                    lineVerts.push(pos[i2 * 3], pos[i2 * 3 + 1], pos[i2 * 3 + 2]);
                }
            }

            for (let c = 0; c < cols; c++) {
                for (let r = 0; r < rows - 1; r++) {
                    const i1 = r * cols + c;
                    const i2 = (r + 1) * cols + c;
                    idxMap.push(i1, i2);
                    lineVerts.push(pos[i1 * 3], pos[i1 * 3 + 1], pos[i1 * 3 + 2]);
                    lineVerts.push(pos[i2 * 3], pos[i2 * 3 + 1], pos[i2 * 3 + 2]);
                }
            }

            const lineGeo = new THREE.BufferGeometry();
            lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(lineVerts, 3));

            const material = new THREE.LineBasicMaterial({
                color: 0x006039,
                transparent: true,
                opacity: 0.12
            });

            terrainMesh = new THREE.LineSegments(lineGeo, material);
            terrainMesh.userData = { geo, idxMap, cols, rows };
            scene.add(terrainMesh);

            window.addEventListener('resize', () => {
                const w = window.innerWidth;
                const h = window.innerHeight;
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
                renderer.setSize(w, h);
            });
        }

        function updateTerrain(time) {
            const { geo, idxMap } = terrainMesh.userData;
            const origPos = geo.attributes.position.array;
            const linePos = terrainMesh.geometry.attributes.position.array;
            const orig = origPositions.array;

            for (let i = 0; i < origPos.length; i += 3) {
                const x = orig[i];
                const z = orig[i + 2];
                origPos[i + 1] = Math.sin(x * 0.8 + time * 0.4) * 0.4
                               + Math.sin(z * 0.6 + time * 0.3) * 0.3
                               + Math.sin((x + z) * 0.5 + time * 0.6) * 0.2;
            }
            geo.attributes.position.needsUpdate = true;

            for (let i = 0; i < linePos.length; i += 3) {
                const origIdx = idxMap[i / 3];
                linePos[i] = origPos[origIdx * 3];
                linePos[i + 1] = origPos[origIdx * 3 + 1];
                linePos[i + 2] = origPos[origIdx * 3 + 2];
            }
            terrainMesh.geometry.attributes.position.needsUpdate = true;
        }

        function terrainLoop() {
            requestAnimationFrame(terrainLoop);
            updateTerrain(Date.now() * 0.001);
            renderer.render(scene, camera);
        }

        initTerrain();
        terrainLoop();

        function toggleRedMode() {
            document.body.classList.toggle('red-mode');
            const isRed = document.body.classList.contains('red-mode');
            terrainMesh.material.color.set(isRed ? 0xcc4444 : 0x006039);
            const icon = document.getElementById('modeIcon');
            icon.setAttribute('data-feather', isRed ? 'sun' : 'moon');
            feather.replace();
        }
    </script>

</body>

</html>
