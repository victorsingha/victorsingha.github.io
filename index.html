    <script>
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

        function shuffleText(element, finalText, speed = 30) {
            let iteration = 0;

            const interval = setInterval(() => {
                element.innerText = finalText
                    .split("")
                    .map((letter, index) => {
                        if (index < iteration) {
                            return finalText[index];
                        }
                        return letters[Math.floor(Math.random() * letters.length)];
                    })
                    .join("");

                if (iteration >= finalText.length) {
                    clearInterval(interval);
                }

                iteration += 1 / 2;
            }, speed);
        }

        const title = document.getElementById("glitch-title");
        const sub = document.getElementById("glitch-sub");

        const titleText = title.innerText;
        const subText = sub.innerText;

        title.innerText = "";
        sub.innerText = "";

        setTimeout(() => shuffleText(title, titleText, 40), 300);
        setTimeout(() => shuffleText(sub, subText, 30), 1200);
    </script>
