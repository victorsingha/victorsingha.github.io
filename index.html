<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Victor Singha</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@800;900&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap"

    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
            background: white;
            color: #111827;
            transition: background 0.4s, color 0.4s;
        }
        body.red-mode {
            background: #3a0000;
            color: #ffffff;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            display: block;
            z-index: -1;
            background: white;
            transition: background 0.4s;
        }
        body.red-mode canvas {
            background: #3a0000;
        }
        body.red-mode .card {
            background: rgba(255,255,255,0.06) !important;
            border-color: rgba(255,255,255,0.1) !important;
        }
        body.red-mode .card:hover {
            background: rgba(255,255,255,0.1) !important;
            border-color: rgba(255,255,255,0.2) !important;
        }
        body.red-mode .card-icon {
            color: rgba(255,255,255,0.5) !important;
        }
        body.red-mode .card-icon:hover {
            color: #ffffff !important;
        }
        body.red-mode .card-arrow {
            color: rgba(255,255,255,0.4) !important;
        }
        body.red-mode .card-arrow:hover {
            color: #ffffff !important;
        }
        body.red-mode .social-btn {
            background: rgba(255,255,255,0.06) !important;
            border-color: rgba(255,255,255,0.1) !important;
            color: rgba(255,255,255,0.5) !important;
        }
        body.red-mode .social-btn:hover {
            background: rgba(255,255,255,0.1) !important;
            border-color: rgba(255,255,255,0.2) !important;
            color: #ffffff !important;
        }
        body.red-mode .divider {
            background: linear-gradient(to right, rgba(255,255,255,0.15), rgba(255,255,255,0.05), transparent) !important;
        }
        body.red-mode .copyright-sep {
            color: rgba(255,255,255,0.2) !important;
        }
        body.red-mode .text-muted {
            color: rgba(255,255,255,0.4) !important;
        }
        body.red-mode .card-title {
            color: #ffffff !important;
        }
        body.red-mode .card-sub {
            color: rgba(255,255,255,0.5) !important;
        }
        body.red-mode .toggle-btn {
            background: rgba(255,255,255,0.1) !important;
            border-color: rgba(255,255,255,0.2) !important;
            color: rgba(255,255,255,0.7) !important;
        }
        body.red-mode .toggle-btn:hover {
            background: rgba(255,255,255,0.18) !important;
            color: #ffffff !important;
        }
        body.red-mode #rotating-word {
            color: #ffffff !important;
        }
        #rotating-word::after {
            content: '|';
            animation: blink 0.7s steps(1) infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>

<body class="bg-white text-gray-900">

    <!-- Animated Background -->
    <canvas id="artPlum"></canvas>

    <div class="max-w-2xl mx-auto px-4 sm:px-8 pt-20 sm:pt-32 pb-20 relative z-10 min-h-screen flex flex-col justify-between">

        <button id="modeToggle" onclick="toggleRedMode()"
            class="toggle-btn fixed top-4 right-4 sm:top-6 sm:right-6 z-20 p-2.5 rounded-full bg-white/40 backdrop-blur-sm text-gray-500 hover:text-gray-900 transition-all duration-300 shadow-sm hover:shadow-md">
            <i id="modeIcon" data-feather="moon" class="w-5 h-5"></i>
        </button>

        <!-- Main Content (Left Aligned) -->
        <main class="flex-grow flex flex-col justify-center">

            <header class="mb-12 sm:mb-16">
                <h1 style="font-family: 'Outfit', sans-serif;"
                    class="text-5xl sm:text-7xl font-black tracking-tight select-none">
                    keep your<br>
                    <span><span id="rotating-word" class="text-[#006039]">design</span> simple</span>
                </h1>
            </header>

            <section class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4 max-w-md w-full">
                <a href="https://victorsingha.github.io/sql/" target="_blank"
                    class="card group flex flex-col justify-between border border-gray-100 bg-white/70 backdrop-blur-sm rounded-2xl p-5 sm:p-6 min-h-[140px] sm:min-h-0 sm:aspect-square hover:border-gray-900/10 hover:bg-gray-50/80 transition-all duration-300 shadow-sm hover:shadow-md">
                    <div class="flex flex-col gap-3 sm:gap-4">
                        <div class="card-icon text-gray-400 group-hover:text-[#006039] transition-colors duration-300">
                            <i class="bi bi-database text-2xl"></i>
                        </div>
                        <div>
                            <p class="card-title font-normal text-gray-900 text-lg">SQL Tool</p>
                            <p class="card-sub text-xs text-gray-400 mt-1">
                                SQL development scripts
                            </p>
                        </div>
                    </div>
                    <div
                        class="card-arrow text-gray-400 group-hover:text-gray-900 group-hover:translate-x-1 transition-all duration-300 self-end">
                        <i data-feather="arrow-right"></i>
                    </div>
                </a>

                <a href="https://victorsingha.github.io/lottie/" target="_blank"
                    class="card group flex flex-col justify-between border border-gray-100 bg-white/70 backdrop-blur-sm rounded-2xl p-5 sm:p-6 min-h-[140px] sm:min-h-0 sm:aspect-square hover:border-gray-900/10 hover:bg-gray-50/80 transition-all duration-300 shadow-sm hover:shadow-md">
                    <div class="flex flex-col gap-3 sm:gap-4">
                        <div class="card-icon text-gray-400 group-hover:text-[#006039] transition-colors duration-300">
                            <i class="bi bi-play-circle text-2xl"></i>
                        </div>
                        <div>
                            <p class="card-title font-normal text-gray-900 text-lg">Lottie</p>
                            <p class="card-sub text-xs text-gray-400 mt-1">
                                Animation viewer
                            </p>
                        </div>
                    </div>
                    <div
                        class="card-arrow text-gray-400 group-hover:text-gray-900 group-hover:translate-x-1 transition-all duration-300 self-end">
                        <i data-feather="arrow-right"></i>
                    </div>
                </a>
            </section>
        </main>

        <!-- Footer -->
        <footer class="mt-20 sm:mt-32">
            <div class="divider h-[1px] w-full bg-gradient-to-r from-gray-200/60 via-gray-100/30 to-transparent mb-6 sm:mb-8"></div>

            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 sm:gap-6 pb-12">
                <div class="flex items-center gap-3">
                    <div class="text-xs text-muted font-sans tracking-wide">
                        <span class="font-normal">Victor Singha</span>
                        <span class="copyright-sep mx-2">/</span>
                        <span>© 2026</span>
                    </div>
                </div>

                <div class="flex gap-2 sm:gap-3">
                    <a href="https://github.com/victorsingha" target="_blank"
                        class="social-btn group flex items-center gap-2 px-3 py-2 sm:py-1.5 rounded-full border border-gray-100 bg-white/40 backdrop-blur-sm text-gray-400 hover:text-gray-900 hover:border-gray-900/10 hover:bg-gray-50/80 transition-all duration-300 shadow-sm hover:shadow-md">
                        <i data-feather="github"></i>
                        <span
                            class="text-[10px] font-normal tracking-wider uppercase opacity-0 group-hover:opacity-100 max-w-0 group-hover:max-w-xs overflow-hidden transition-all duration-500 ease-in-out">GitHub</span>
                    </a>

                    <a href="https://in.linkedin.com/in/victor-singha-48b479148" target="_blank"
                        class="social-btn group flex items-center gap-2 px-3 py-2 sm:py-1.5 rounded-full border border-gray-100 bg-white/40 backdrop-blur-sm text-gray-400 hover:text-gray-900 hover:border-gray-900/10 hover:bg-gray-50/80 transition-all duration-300 shadow-sm hover:shadow-md">
                        <i data-feather="linkedin"></i>
                        <span
                            class="text-[10px] font-normal tracking-wider uppercase opacity-0 group-hover:opacity-100 max-w-0 group-hover:max-w-xs overflow-hidden transition-all duration-500 ease-in-out">LinkedIn</span>
                    </a>
                </div>
            </div>
        </footer>

    </div>

    <script>
        feather.replace({ width: 16, height: 16 });

        function toggleRedMode() {
            document.body.classList.toggle('red-mode');
            const isRed = document.body.classList.contains('red-mode');
            STROKE_COLOR = isRed ? "rgba(255, 255, 255, 0.15)" : "rgba(0, 0, 0, 0.08)";
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = STROKE_COLOR;
            ctx.lineWidth = LINE_WIDTH;
            tasks = [];
            next = [];
            tasks = [
                () => branch(Math.random() * window.innerWidth, -5, Math.PI / 2),
                () => branch(Math.random() * window.innerWidth, window.innerHeight + 5, -Math.PI / 2),
                () => branch(-5, Math.random() * window.innerHeight, 0),
                () => branch(window.innerWidth + 5, Math.random() * window.innerHeight, Math.PI)
            ];
            if (window.innerWidth < 500) tasks = tasks.slice(0, 2);
            const icon = document.getElementById('modeIcon');
            icon.setAttribute('data-feather', isRed ? 'sun' : 'moon');
            feather.replace();
        }

        const words = ['design', 'typo', 'color', 'code', 'system'];
        let idx = 0;
        const el = document.getElementById('rotating-word');

        function typeWord(word, cb) {
            let i = 0;
            function type() {
                if (i < word.length) {
                    el.textContent = word.slice(0, ++i);
                    setTimeout(type, 100);
                } else if (cb) cb();
            }
            type();
        }

        function deleteWord(cb) {
            let cur = el.textContent;
            function del() {
                if (cur.length > 0) {
                    cur = cur.slice(0, -1);
                    el.textContent = cur;
                    setTimeout(del, 60);
                } else if (cb) cb();
            }
            del();
        }

        function cycle() {
            deleteWord(() => {
                idx = (idx + 1) % words.length;
                typeWord(words[idx], () => setTimeout(cycle, 2000));
            });
        }

        setTimeout(cycle, 2000);

        const MAX_DEPTH = 25;
        const BRANCH_SPREAD = Math.PI / 12;
        let STROKE_COLOR = "rgba(0, 0, 0, 0.08)";
        const LINE_WIDTH = 1;

        const canvas = document.getElementById("artPlum");
        const ctx = canvas.getContext("2d");

        function resizeOnce() {
            const dpr = window.devicePixelRatio || 1;

            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        resizeOnce();

        function nextPoint(x, y, len, angle) {
            return [
                x + len * Math.cos(angle),
                y + len * Math.sin(angle)
            ];
        }

        let next = [];
        let tasks = [];

        function branch(x, y, angle, state = { depth: 0 }) {

            const len = Math.random() * 8 + 2;

            state.depth++;

            const [nx, ny] = nextPoint(x, y, len, angle);

            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(nx, ny);
            ctx.stroke();

            if (
                nx < -100 ||
                nx > window.innerWidth + 100 ||
                ny < -100 ||
                ny > window.innerHeight + 100
            ) return;

            const continueChance =
                state.depth <= MAX_DEPTH ? 0.8 : 0.5;

            const a1 = angle + Math.random() * BRANCH_SPREAD;
            const a2 = angle - Math.random() * BRANCH_SPREAD;

            if (Math.random() < continueChance)
                next.push(() => branch(nx, ny, a1, state));

            if (Math.random() < continueChance)
                next.push(() => branch(nx, ny, a2, state));
        }

        function init() {

            ctx.strokeStyle = STROKE_COLOR;
            ctx.lineWidth = LINE_WIDTH;

            tasks = [
                () => branch(Math.random() * window.innerWidth, -5, Math.PI / 2),

                () => branch(
                    Math.random() * window.innerWidth,
                    window.innerHeight + 5,
                    -Math.PI / 2
                ),

                () => branch(
                    -5,
                    Math.random() * window.innerHeight,
                    0
                ),

                () => branch(
                    window.innerWidth + 5,
                    Math.random() * window.innerHeight,
                    Math.PI
                )
            ];

            if (window.innerWidth < 500)
                tasks = tasks.slice(0, 2);

            animate();
        }

        let last = performance.now();

        const frameInterval = 1000 / 40;

        function animate() {

            requestAnimationFrame(animate);

            const now = performance.now();

            if (now - last < frameInterval) return;

            last = now;

            const current = tasks;

            tasks = [];

            if (!current.length && !next.length) return;

            current.forEach(f =>
                (Math.random() < 0.5 ? next.push(f) : f())
            );

            tasks = next;
            next = [];
        }

        init();
    </script>

</body>

</html>
