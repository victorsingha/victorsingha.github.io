<!-- ================= GLITCH SCRIPT ================= -->

<script>

const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

function shuffleText(el,text,speed=20){
let iteration=0;

const interval=setInterval(()=>{
el.innerText=text.split("").map((l,i)=>{
if(i<iteration)return text[i];
return letters[Math.floor(Math.random()*letters.length)];
}).join("");

if(iteration>=text.length)clearInterval(interval);

iteration+=0.5;
},speed);
}

/* elements */
const victor=document.getElementById("glitch-victor");
const singha=document.getElementById("glitch-singha");
const sub=document.getElementById("glitch-sub");

/* original text */
const vText=victor.innerText;
const sText=singha.innerText;
const subText=sub.innerText;

/* clear */
victor.innerText="";
singha.innerText="";
sub.innerText="";

/* stagger animation */
setTimeout(()=>shuffleText(victor,vText,25),200);
setTimeout(()=>shuffleText(singha,sText,25),700);
setTimeout(()=>shuffleText(sub,subText,20),1400);

</script>
